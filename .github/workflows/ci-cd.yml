name: CI and Docker publishing

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven-tests:
    name: Maven build and tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven Wrapper
        run: sed -i 's/\r$//' mvnw && chmod +x mvnw

      - name: Build and verify
        # Runs Maven's full lifecycle through compilation, tests, and packaging.
        run: ./mvnw -B clean verify

  publish-maven-packages:
    name: Build, verify, and publish Maven packages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github-artifactory
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Prepare Maven Wrapper
        run: sed -i 's/\r$//' mvnw && chmod +x mvnw

      - name: Build, verify, and publish
        # Deploy includes verification and publishes the same build's Maven artifacts.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B clean deploy

      # Pass the verified and published JARs to the separate image-build runner.
      - name: Upload service JARs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            user-service/target/*.jar
            notify-service/target/*.jar
          if-no-files-found: error

  publish-images:
    name: Build and publish ${{ matrix.service }} image
    # Publish only after verification succeeds, and only for pushes to master.
    needs: publish-maven-packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, notify-service]
    steps:
      - uses: actions/checkout@v4

      - name: Download verified service JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - uses: docker/setup-buildx-action@v3

      - name: Read service version from built JAR
        id: version
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          shopt -s nullglob
          jars=("$SERVICE"/target/"$SERVICE"-*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one packaged JAR for $SERVICE, found ${#jars[@]}" >&2
            exit 1
          fi
          jar="${jars[0]##*/}"
          version="${jar#"$SERVICE"-}"
          version="${version%.jar}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Authenticate to Docker Hub so the built service image can be published.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=snapshot,enable=${{ contains(steps.version.outputs.value, 'SNAPSHOT') }}
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/ci.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}