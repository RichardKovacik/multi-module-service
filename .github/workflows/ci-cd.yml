name: CI and Docker publishing

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven-tests:
    name: Maven build and tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven Wrapper
        run: |
          echo "Preparing Maven Wrapper for Linux execution."
          sed -i 's/\r$//' mvnw && chmod +x mvnw

      - name: Build and verify
        # Runs Maven's full lifecycle through compilation, tests, and packaging.
        run: |
          echo "Running Maven clean verify for pull request."
          ./mvnw -B clean verify
          echo "Pull request verification completed successfully."

  publish-maven-packages:
    name: Build, verify, and publish Maven packages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github-artifactory
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Prepare Maven Wrapper
        run: |
          echo "Preparing Maven Wrapper for Linux execution."
          sed -i 's/\r$//' mvnw && chmod +x mvnw

      - name: Build, verify, and publish
        # Deploy includes verification and publishes the same build's Maven artifacts.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Maven clean deploy: verify the project and publish Maven packages to GitHub Packages."
          ./mvnw -B clean deploy
          echo "Maven verification and package publishing completed successfully."

  publish-images:
    name: Build and publish ${{ matrix.service }} image
    # Publish only after Maven verification and package deployment succeed.
    needs: publish-maven-packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        service: [user-service, notify-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github-artifactory
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Download service JAR from GitHub Packages
        id: version
        env:
          SERVICE: ${{ matrix.service }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Preparing Maven Wrapper for Linux execution."
          sed -i 's/\r$//' mvnw && chmod +x mvnw

          group_id="$(./mvnw -q -f "$SERVICE/pom.xml" -Dexpression=project.groupId -DforceStdout help:evaluate)"
          version="$(./mvnw -q -f "$SERVICE/pom.xml" -Dexpression=project.version -DforceStdout help:evaluate)"
          if [ -z "$group_id" ] || [ -z "$version" ]; then
            echo "Could not determine Maven coordinates for $SERVICE." >&2
            exit 1
          fi

          echo "Downloading ${group_id}:${SERVICE}:${version}:jar from GitHub Packages."
          ./mvnw -B org.apache.maven.plugins:maven-dependency-plugin:3.7.1:copy \
            "-Dartifact=${group_id}:${SERVICE}:${version}:jar" \
            "-DoutputDirectory=${SERVICE}/target"

          shopt -s nullglob
          jars=("$SERVICE"/target/"$SERVICE"-"$version".jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected the downloaded JAR for $SERVICE version $version." >&2
            exit 1
          fi

          echo "Using Maven version $version as the single Docker image tag for $SERVICE."
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Authenticate to Docker Hub so the built service image can be published.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log Docker image build
        run: echo "Building and publishing one ${{ matrix.service }} image tagged ${{ steps.version.outputs.tag }}."
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/ci.dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Confirm Docker image published
        run: echo "Successfully built and published ${{ matrix.service }}:${{ steps.version.outputs.tag }}."