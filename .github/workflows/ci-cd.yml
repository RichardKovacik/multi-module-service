name: Maven CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven-build-tests:
    name: Build and test
    runs-on: ubuntu-latest
    # [CHANGE] Bound runner time and cost if Maven hangs.
    timeout-minutes: 30
    steps:
      - name: Check out source
        # [CHANGE] Pin the checkout action to a verified immutable commit SHA.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        # [CHANGE] Pin the Java setup action to a verified immutable commit SHA.
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build project and run unit tests
        run: ./mvnw -B clean verify
