name: CI and Docker publishing

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven-tests:
    name: Maven build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven Wrapper
        run: sed -i 's/\r$//' mvnw && chmod +x mvnw

      - name: Build and test
        # Runs Maven's full lifecycle, including compilation, tests, and packaging.
        run: ./mvnw -B clean verify

      # The image job runs on a separate runner, so pass it the JARs verified above.
      - name: Upload service JARs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            user-service/target/*.jar
            notify-service/target/*.jar
          if-no-files-found: error

  publish-images:
    name: Build and publish ${{ matrix.service }} image
    # Publish only after verification succeeds, and only for pushes to master.
    needs: maven-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, notify-service]
    steps:
      - uses: actions/checkout@v4

      - name: Download verified service JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - uses: docker/setup-buildx-action@v3

      # Authenticate to Docker Hub so the built service image can be published.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=snapshot,enable=${{ github.ref == 'refs/heads/master' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/ci.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}