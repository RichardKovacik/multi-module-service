name: CI and Docker publishing

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven-tests:
    name: Maven build, test, and deploy to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # required for mvn deploy to GitHub Packages
    outputs:
      maven-version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github-artifactory        # matches <id> in pom.xml distributionManagement
          settings-path: ${{ github.workspace }}

      - name: Prepare Maven Wrapper
        run: sed -i 's/\r$//' mvnw && chmod +x mvnw

      - name: Extract Maven version
        id: version
        run: |
          VERSION=$(./mvnw -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' --non-recursive exec:exec)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./mvnw -B clean verify

      # Push to master only: publish snapshots (or whatever version is in pom.xml)
      - name: Deploy to GitHub Packages
        if: github.event_name == 'push'
        run: ./mvnw -B deploy -DskipTests -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-images:
    name: Build and publish ${{ matrix.service }} image
    needs: maven-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, notify-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github-artifactory
          settings-path: ${{ github.workspace }}

      - name: Download JAR from GitHub Packages
        run: |
          mvn dependency:copy \
            -Dartifact=com.yourcompany:${SERVICE}:${MAVEN_VERSION}:jar \
            -DoutputDirectory=${SERVICE}/target \
            -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          SERVICE: ${{ matrix.service }}
          MAVEN_VERSION: ${{ needs.maven-tests.outputs.maven-version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Single, meaningful tag per service: maven-version + short SHA
      - name: Compute Docker tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=${{ needs.maven-tests.outputs.maven-version }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/ci.dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}